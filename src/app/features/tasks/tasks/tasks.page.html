<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mis Tareas</ion-title>
    <ion-buttons slot="end">
      <ion-button
        *ngIf="(flags$ | async)?.enableCategories"
        routerLink="/categories"
        title="Categorías">
        <ion-icon slot="icon-only" name="pricetags-outline"></ion-icon>
      </ion-button>
      <ion-button routerLink="/settings" title="Configuración">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Category filter chips -->
  <ng-container *ngIf="categories$ | async as categories">
    <ng-container *ngIf="flags$ | async as flags">
    <div class="category-filter" *ngIf="categories.length > 0 && flags.enableCategories">
      <ion-chip
        [class.selected]="selectedCategoryId === null"
        (click)="filterByCategory(null)">
        <ion-label>Todas</ion-label>
      </ion-chip>
      <ion-chip
        *ngFor="let cat of categories"
        [style.--background]="cat.color"
        [class.selected]="selectedCategoryId === cat.id"
        (click)="filterByCategory(cat.id)">
        <ion-label>{{ cat.name }}</ion-label>
      </ion-chip>
    </div>

    <!-- Task list -->
    <ng-container *ngIf="tasks$ | async as tasks">
    <ng-container *ngIf="flags$ | async as flags">

      <!-- Empty state -->
      <div class="empty-state" *ngIf="getFilteredTasks(tasks, flags.showCompletedTasks).length === 0 && !showAddForm">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <h3>¡Sin tareas pendientes!</h3>
        <p>Tocá el botón + para agregar una nueva tarea</p>
      </div>

      <ion-list *ngIf="getFilteredTasks(tasks, flags.showCompletedTasks).length > 0">
        <ion-item-sliding
          *ngFor="let task of getFilteredTasks(tasks, flags.showCompletedTasks); trackBy: trackById">

          <ion-item [class.completed]="task.completed" lines="full">
            <ion-checkbox
              slot="start"
              [checked]="task.completed"
              (ionChange)="toggleTask(task.id)">
            </ion-checkbox>
            <ion-label>
              <h2>{{ task.title }}</h2>
              <p *ngIf="task.description">{{ task.description }}</p>
              <ion-badge
                *ngIf="task.categoryId"
                [style.--background]="getCategoryById(task.categoryId, categories)?.color">
                {{ getCategoryById(task.categoryId, categories)?.name }}
              </ion-badge>
            </ion-label>
            <ion-button
              slot="end"
              fill="clear"
              color="danger"
              (click)="deleteTask(task.id)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-button>
          </ion-item>

          <!-- Swipe-to-delete (works on mobile native) -->
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="deleteTask(task.id)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>

        </ion-item-sliding>
      </ion-list>

      <!-- Add Task Form -->
      <ion-card *ngIf="showAddForm" class="add-form-card">
        <ion-card-content>
          <ion-item lines="none">
            <ion-input
              [(ngModel)]="newTaskTitle"
              placeholder="¿Qué tenés que hacer? *"
              autofocus="true">
            </ion-input>
          </ion-item>

          <ion-item lines="none">
            <ion-textarea
              [(ngModel)]="newTaskDescription"
              placeholder="Detalles adicionales (opcional)"
              rows="2">
            </ion-textarea>
          </ion-item>

          <ion-item lines="none" *ngIf="categories.length > 0 && flags.enableCategories">
            <ion-select [(ngModel)]="newTaskCategoryId" placeholder="Seleccionar categoría">
              <ion-select-option value="">Sin categoría</ion-select-option>
              <ion-select-option *ngFor="let cat of categories" [value]="cat.id">
                {{ cat.name }}
              </ion-select-option>
            </ion-select>
          </ion-item>

          <div class="form-actions">
            <ion-button fill="clear" color="medium" (click)="showAddForm = false">
              Cancelar
            </ion-button>
            <ion-button (click)="addTask()" [disabled]="!newTaskTitle.trim()">
              Guardar
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>

    </ng-container>
    </ng-container>
    </ng-container>
  </ng-container>

  <!-- FAB -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="showAddForm = !showAddForm" color="primary">
      <ion-icon [name]="showAddForm ? 'close' : 'add'"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
